<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Strict CSP. The build has no inline scripts (only an external module
      script) and no eval, so `script-src 'self'` is enough; React sets styles
      through the CSSOM, which is not blocked by `style-src 'self'`.
      `img-src` needs `data:` for the inline SVG favicon.
      Note: `frame-ancestors` is ignored in a meta CSP and only logs a console
      error, so it is deliberately omitted.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <!-- Pages cannot set headers, so the policy above is meta-only. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <title>Life in the UK · Timeline</title>
    <meta
      name="description"
      content="An interactive timeline of the dates to memorise for the Life in the UK test."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
