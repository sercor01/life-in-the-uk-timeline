name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The tests gate the deploy: typecheck, build, dependency audits and all four
  # browser suites, shared with the pull_request run via the reusable workflow.
  # A push to main therefore gets exactly one CI run, and redeploys cannot skip it.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: configure-pages@v5

      - uses: upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
